[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-os"
version = "0.2.0"
description = "AI-OS: An event-driven AI operating system for research, planning, execution, and memory."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Yash Mahajan" }
]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "aiohttp>=3.9",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "black>=24.0",
    "psutil>=5.9",
]
browser = [
    "playwright>=1.40",
]

[project.scripts]
aios = "aios.cli.main:app"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aios*"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "UP", "W"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration", "tests/performance"]
markers = [
    # M8-T6 marker scheme (spec §18/§21.11). Registered additively; does not
    # alter M7/T1-T5 behavior.
    "integration: cross-integration tests exercising two or more external capabilities",
    "e2e: end-to-end production-style workflow tests (kernel boot + orchestrator)",
    "gated: real-external tests gated behind env vars (HERMES_ACP_TEST / PLAYWRIGHT_E2E_TEST / GRAPHIFY_E2E_TEST) — deselected by default",
    "security: security-integration tests (secret scrubbing, redaction, boundaries)",
    "slow: long-running tests (real stdio subprocess startup, timeouts)",
    "external: tests that would reach a real external service (never run hermetically)",
    "real: production-path tests using the real MCPManager over stdio subprocesses (in-repo mock-server commands)",
]