<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI-OS Dashboard — Read-Only UI (Non-Authoritative)</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #c9d1d9;
    --muted: #8b949e; --accent: #2f81f7; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
  header .badge { font-size: 12px; padding: 3px 8px; border: 1px solid var(--warn); color: var(--warn); border-radius: 6px; }
  nav { display: flex; gap: 4px; padding: 8px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  nav button { background: var(--panel); color: var(--text); border: 1px solid var(--border); padding: 7px 12px; border-radius: 6px; cursor: pointer; }
  nav button.active { border-color: var(--accent); color: var(--accent); }
  main { padding: 18px; }
  .page { display: none; }
  .page.active { display: block; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 10px; font-size: 14px; color: var(--accent); }
  .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
  .row:last-child { border-bottom: none; }
  .k { color: var(--muted); } .v { color: var(--text); text-align: right; max-width: 60%; word-break: break-word; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .pill { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 10px; border: 1px solid var(--border); }
  .json { white-space: pre-wrap; font-family: monospace; font-size: 12px; color: var(--muted); max-height: 280px; overflow: auto; }
  button.action { background: var(--accent); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-right: 6px; }
  button.action:disabled { opacity: .5; cursor: not-allowed; }
  .note { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .phase-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
  .phase { font-size: 12px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); }
  .phase.done { border-color: var(--ok); color: var(--ok); }
  .phase.pending { color: var(--muted); }
  #toast { position: fixed; bottom: 16px; right: 16px; background: var(--panel); border: 1px solid var(--border); padding: 10px 14px; border-radius: 8px; display: none; max-width: 360px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <strong>AI-OS Dashboard</strong>
  <span class="badge">READ-ONLY · NON-AUTHORITATIVE</span>
  <span class="note" style="margin:0">AI-OS (Terminal 1) is the sole governance, verification &amp; decision authority. This UI only visualizes state and forwards authorized actions.</span>
</header>
<nav>
  <button data-page="planning_chat" class="active">1 · Planning Workspace</button>
  <button data-page="resource_onboarding">2 · Resource Onboarding</button>
  <button data-page="project_workspace">3 · Project Workspace</button>
  <button data-page="project_execution">4 · Project / Execution</button>
  <button data-page="knowledge_history">5 · Knowledge / History</button>
  <button data-page="integrations_credentials">6 · Integrations &amp; Credentials</button>
  <button data-page="system_health">7 · System / Health</button>
  <button data-page="system_observability">8 · System / Observability</button>
</nav>
<main>
  <div class="note" id="meta"></div>

  <section class="page active" id="page-planning_chat"></section>
  <section class="page" id="page-resource_onboarding"></section>
  <section class="page" id="page-project_workspace"></section>
  <section class="page" id="page-project_execution"></section>
  <section class="page" id="page-knowledge_history"></section>
  <section class="page" id="page-integrations_credentials"></section>
  <section class="page" id="page-system_health"></section>
  <section class="page" id="page-system_observability"></section>
</main>
<div id="toast"></div>

<script>
const API_PAGES = "/api/pages";
const API_ACTION = "/api/action";
let DATA = null;

function kv(k, v, cls) {
  return `<div class="row"><span class="k">${k}</span><span class="v ${cls||''}">${escapeHtml(String(v))}</span></div>`;
}
function card(title, html) { return `<div class="card"><h3>${title}</h3>${html}</div>`; }
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg, ok){ const t=document.getElementById('toast'); t.textContent=msg; t.style.borderColor=ok?'var(--ok)':'var(--bad)'; t.style.display='block'; setTimeout(()=>t.style.display='none',4000); }

async function load() {
  const res = await fetch(API_PAGES);
  DATA = await res.json();
  render();
}
function render() {
  const gen = DATA.generated_at;
  document.getElementById('meta').textContent =
    `Snapshot @ ${gen} · authority model: ${DATA.authority_model}`;
  renderPlanning();
  renderOnboarding();
  renderProject();
  renderExecution();
  renderKnowledge();
  renderIntegrations();
  renderHealth();
  renderObservability();
}

function renderPlanning() {
  const p = DATA.pages.planning_chat;

  // Check if we have project context (for Planning Workspace mode)
  const hasProjectContext = p.project_context && p.project_context.name;

  if (hasProjectContext) {
    // Planning Workspace mode - ChatGPT style interface
    const project = p.project_context;
    const messages = p.messages || [];

    let html = `<div class="planning-workspace">
      <div class="workspace-sidebar">
        <div class="workspace-header">
          <button class="action" onclick="newChat()" style="width:100%;margin-bottom:8px;">+ New Chat</button>
          <div class="workspace-project-info">
            <div class="workspace-project-name">${escapeHtml(project.name)}</div>
            <div class="workspace-project-state">
              <span class="pill ${project.state==='PLANNING'?'ok':project.state==='DISCUSSION'?'warn':''}">${escapeHtml(project.state||'—')}</span>
            </div>
            <div class="workspace-project-stats">
              ${escapeHtml(project.message_count)} messages
            </div>
          </div>
        </div>

        <div class="workspace-projects-list">
          <div class="workspace-section-header">Projects</div>
          <div id="workspace-projects-list-content">
            <!-- Projects will be populated here -->
          </div>
        </div>
      </div>

      <div class="workspace-main">
        <div class="workspace-conversation-header">
          <div>${escapeHtml(project.name)}</div>
          <div class="workspace-conversation-status">
            <span class="pill ${project.state==='PLANNING'?'ok':project.state==='DISCUSSION'?'warn':''}">${escapeHtml(project.state||'—')}</span>
          </div>
        </div>

        <div class="workspace-conversation" id="workspace-conversation-messages">
          <!-- Messages will be populated here -->
        </div>

        <div class="workspace-input-area">
          <input id="planning-input" type="text" placeholder="Message AI-OS..."
                 style="background:var(--bg);color:var(--text);border:1px solid var(--border);
                        padding:12px;border-radius:4px;width:calc(100% - 80px);margin-right:8px;"
                 onkeypress="if(event.key==='Enter'){event.preventDefault();submitPlanningMessage();}" />
          <button class="action" onclick="submitPlanningMessage()">➤</button>
        </div>
      </div>
    </div>`;

    document.getElementById('page-planning_chat').innerHTML = html;

    // Populate projects list
    populateProjectsList();

    // Populate messages
    populateMessages(messages);
  } else {
    // Original planning chat mode (fallback)
    const sl = p.self_loop || {};
    let html = card("Self-Loop Engine (authoritative autonomous loop)",
      kv("running", sl.running) + kv("paused", sl.paused) + kv("mock_mode", sl.mock_mode)
      + kv("cycle_count", sl.cycle_count) + kv("current_cycle", sl.current_cycle||'-')
      + kv("current_phase", sl.current_phase||'-'));
    const gen = p.generator_config || {};
    html += card("Self-Prompt Generator config",
      kv("max_cycles", gen.max_cycles) + kv("max_depth", gen.max_depth) + kv("convergence_action", gen.convergence_action));
    const ph = (p.phase_map||[]).map(x =>
      `<div class="phase ${x.completed?'done':'pending'}">${x.phase}${x.completed?' ✓':''}</div>`).join('');
    html += card("19-Phase Lifecycle", `<div class="phase-grid">${ph}</div>`);
    const sp = p.last_self_prompt || {};
    html += card("Last Self-Prompt (read-only)",
      kv("action_type", sp.action_type||'-') + kv("target_systems", JSON.stringify(sp.target_systems||[]))
      + kv("validation_status", sp.validation_status||'-'));

    // Human message input for Planning Chat
    html += `<div class="card"><h3>Planning Chat</h3>
      <div class="note">Send a message to the AI-OS planning system (gated by SecurityManager)</div>
      <input id="planning-input" type="text" placeholder="Enter your planning message..."
             style="background:var(--bg);color:var(--text);border:1px solid var(--border);
                    padding:8px;border-radius:4px;width:70%;margin-right:8px;" />
      <button class="action" onclick="submitPlanningMessage()">Send</button>
      <div class="note" style="margin-top:8px">Messages are routed through AI-OS authority architecture.</div></div>`;

    document.getElementById('page-planning_chat').innerHTML = html
      + `<div class="card"><h3>Authorized actions</h3>
         <button class="action" onclick="act('self_loop.control',{op:'pause'})">Pause loop</button>
         <button class="action" onclick="act('self_loop.control',{op:'resume'})">Resume loop</button>
         <button class="action" onclick="act('self_loop.control',{op:'stop'})">Stop loop</button>
         <div class="note" style="margin-top:8px">These are forwarded to AI-OS and gated by SecurityManager (fail-closed).</div></div>`;
  }
}

// Helper function to populate projects list in sidebar
function populateProjectsList() {
  const projectsContainer = document.getElementById('workspace-projects-list-content');
  if (!projectsContainer) return;

  const projects = DATA.pages.project_workspace.projects || [];
  const selectedProjectId = SELECTED_PROJECT_ID;

  if (projects.length === 0) {
    projectsContainer.innerHTML = `<div class="workspace-note">No projects available</div>`;
    return;
  }

  let html = '';
  projects.forEach(proj => {
    const isSelected = proj.project_id === selectedProjectId;
    html += `<div class="workspace-project-item ${isSelected?'workspace-project-selected':''}"
               onclick="selectProject('${proj.project_id}')">
               <div class="workspace-project-name">${escapeHtml(proj.name)}</div>
               <div class="workspace-project-meta">
                 ${escapeHtml(proj.state)} · ${proj.message_count} msgs
               </div>
             </div>`;
  });

  projectsContainer.innerHTML = html;
}

// Helper function to populate messages in conversation area
function populateMessages(messages) {
  const messagesContainer = document.getElementById('workspace-conversation-messages');
  if (!messagesContainer) return;

  if (messages.length === 0) {
    messagesContainer.innerHTML = `<div class="workspace-empty-state">Start the conversation by sending a message above.</div>`;
    return;
  }

  let html = '';
  messages.forEach(msg => {
    const isUser = msg.role === 'user';
    html += `<div class="workspace-message ${isUser?'workspace-message-user':'workspace-message-aios'}">
               <div class="workspace-message-content">${escapeHtml(msg.content)}</div>
               <div class="workspace-message-meta">
                 <span class="workspace-message-role">${escapeHtml(msg.role)}</span>
                 <span class="workspace-message-time">${formatTimestamp(msg.created_at)}</span>
               </div>
             </div>`;
  });

  messagesContainer.innerHTML = html;
  // Scroll to bottom to show latest message
  messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

// Helper function to format timestamps
function formatTimestamp(timestampStr) {
  if (!timestampStr) return '';
  try {
    const date = new Date(timestampStr);
    return date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  } catch (e) {
    return timestampStr.substring(11, 16); // Fallback to HH:MM format
  }
}

// Enhanced selectProject function to handle Planning Workspace mode
async function selectProject(projectId) {
  SELECTED_PROJECT_ID = projectId;
  await loadPlanningWorkspace();
}

// Enhanced load function to handle Planning Workspace mode
async function load() {
  const res = await fetch(API_PAGES);
  DATA = await res.json();

  // If a project is selected, fetch its specific workspace data for planning
  if (SELECTED_PROJECT_ID !== null) {
    try {
      const projectRes = await fetch(`/api/pages?project_id=${SELECTED_PROJECT_ID}`);
      const projectData = await projectRes.json();
      // Merge planning chat data with project-specific data
      if (projectData.pages && projectData.pages.planning_chat) {
        // Preserve other page data but replace planning chat with project-specific data
        DATA.pages.planning_chat = projectData.pages.planning_chat;
      }
    } catch (err) {
      // If fetching specific project fails, fall back to index view
      console.warn("Failed to load project workspace, falling back to index:", err);
      SELECTED_PROJECT_ID = null;
    }
  }

  render();
}

// New function to load just the planning workspace data
async function loadPlanningWorkspace() {
  if (SELECTED_PROJECT_ID === null) {
    // No project selected, load basic planning chat
    const res = await fetch(API_PAGES);
    DATA = await res.json();
    renderPlanning();
    return;
  }

  try {
    const projectRes = await fetch(`/api/pages?project_id=${SELECTED_PROJECT_ID}`);
    const projectData = await projectRes.json();
    if (projectData.pages && projectData.pages.planning_chat) {
      DATA.pages.planning_chat = projectData.pages.planning_chat;
      renderPlanning();
    }
  } catch (err) {
    console.warn("Failed to load planning workspace:", err);
    // Fallback to basic planning chat
    const res = await fetch(API_PAGES);
    DATA = await res.json();
    renderPlanning();
  }
}

// New Chat function - UI reset only, does not delete persisted messages
function newChat() {
  // Clear project selection but preserve all persisted data
  SELECTED_PROJECT_ID = null;
  loadPlanningWorkspace();
  toast("Started new chat. Persisted project history preserved.", true);
}

function renderOnboarding() {
  const p = DATA.pages.resource_onboarding;
  let html = card("Terminal-Contract Authority", p.all_bounded_resources
      ? `<span class="pill ok">ALL RESOURCES BOUNDED</span>`
      : `<span class="pill bad">VIOLATIONS DETECTED</span>`);
  const integrations = (p.integrations||[]).map(i =>
    card(i.name||'?', kv("state", i.state) + kv("mode", i.mode) + kv("authority_level", i.authority_level)
      + kv("terminal", i.terminal) + kv("real_allowed", i.real_allowed)
      + `<button class="action" onclick="act('integration.validate',{name:'${i.name}'})">Validate</button>`)
  ).join('');
  html += card("Integrations (onboarding status)", integrations || "<div class='note'>none</div>");
  document.getElementById('page-resource_onboarding').innerHTML = html;
}

function renderExecution() {
  const p = DATA.pages.project_execution;
  const c = p.cycle || {};
  let html = card("Active Cycle", kv("running", c.running) + kv("cycle_count", c.cycle_count) + kv("current_phase", c.current_phase||'-'));
  const be = p.bounded_execution || {};
  html += card("Bounded Execution", kv("success", be.success) + kv("error", be.error||'-') + kv("duration_ms", be.duration_ms));
  const fr = p.failure_recovery || {};
  html += card("Failure Recovery (AI-OS-authoritative)",
    kv("records", fr.count) + kv("outcomes", JSON.stringify(fr.outcomes||{})));
  const recs = (fr.records||[]).map(r =>
    `<div class="row"><span class="k">${r.component}</span><span class="v">${r.outcome} · ${r.provenance_authority||'-'}</span></div>`).join('');
  html += card("Recovery Records", recs || "<div class='note'>none</div>");
  document.getElementById('page-project_execution').innerHTML = html;
}

function renderKnowledge() {
  const p = DATA.pages.knowledge_history;
  const adapters = Object.entries(p.adapters||{}).map(([n,a]) =>
    card(n, kv("mode", a.mode) + kv("connected", a.connected) + kv("authority_level", a.authority_level) + kv("terminal", a.terminal))
  ).join('');
  let html = card("Durability / Persistence Adapters", adapters || "<div class='note'>none</div>");
  html += card("Obsidian Git History (local only)",
    `<div class="json">${escapeHtml(JSON.stringify(p.obsidian_git_history||[], null, 2))}</div>`);
  document.getElementById('page-knowledge_history').innerHTML = html;
}

function renderProject() {
  const p = DATA.pages.project_workspace;
  if (!p || !p.available) {
    document.getElementById('page-project_workspace').innerHTML =
      card("Project Workspace", `<div class="note">${escapeHtml(p && p.reason ? p.reason : 'Project service unavailable (non-authoritative).')}</div>`);
    return;
  }
  let html = "";
  if (p.project && p.found) {
    // Single-project view
    const proj = p.project;
    html += card(`Project: ${proj.name}`,
      kv("state", proj.state) + kv("messages", proj.message_count) +
      kv("decisions", proj.decision_count) + kv("tasks", proj.task_count) +
      kv("notion_page_id", proj.notion_page_id || "—"));
    html += card("Allowed transitions (AI-OS-validated)",
      (p.allowed_transitions||[]).map(t => `<span class="pill">${t}</span>`).join(" ") || "<div class='note'>none</div>");
    const msgs = (p.messages||[]).map(m =>
      `<div class="row"><span class="k">${escapeHtml(m.role)}</span><span class="v">${escapeHtml(String(m.content).slice(0,200))}</span></div>`).join('');
    html += card("Chat (project-scoped, persisted to vault)", msgs || "<div class='note'>no messages</div>");
    const decs = (p.decisions||[]).map(d =>
      `<div class="row"><span class="k">${escapeHtml(d.title)}</span><span class="v">${escapeHtml(d.outcome||'pending')}</span></div>`).join('');
    html += card("Decisions (append-only, AI-OS-owned)", decs || "<div class='note'>none</div>");
    const tasks = (p.tasks||[]).map(t =>
      `<div class="row"><span class="k">${escapeHtml(t.title)}</span><span class="v">${escapeHtml(t.status)}</span></div>`).join('');
    html += card("Tasks", tasks || "<div class='note'>none</div>");
    html += `<div class="card"><h3>Lifecycle actions (gated via SecurityManager)</h3>
      <button class="action" onclick="act('project.transition',{project_id:'${proj.project_id}',to_state:'DISCUSSION'})">→ DISCUSSION</button>
      <button class="action" onclick="act('project.transition',{project_id:'${proj.project_id}',to_state:'RESEARCH'})">→ RESEARCH</button>
      <button class="action" onclick="act('project.transition',{project_id:'${proj.project_id}',to_state:'PLANNING'})">→ PLANNING</button>
      <button class="action" onclick="act('project.publish_notion',{project_id:'${proj.project_id}'})">Publish final plan to Notion</button>
      <button class="action" onclick="act('project.clear_action',{project_id:'${proj.project_id}'})">Clear for action</button>
      <div class="note" style="margin-top:8px">Discussion never becomes execution. Every action is advisory until AI-OS (SecurityManager) approves it.</div></div>`;
  } else {
    // Index view
    const projs = (p.projects||[]).map(pr =>
      `<div class="row"><span class="k">${escapeHtml(pr.name)}</span><span class="v">${escapeHtml(pr.state)} · ${pr.message_count} msgs</span></div>`).join('');
    html += card("Projects", projs || "<div class='note'>no projects</div>");
    html += `<div class="card"><h3>New project</h3>
      <input id="proj-name" placeholder="Project name" style="background:var(--bg);color:var(--text);border:1px solid var(--border);padding:6px;border-radius:6px;width:60%">
      <button class="action" onclick="createProject()">Create project</button>
      <div class="note" style="margin-top:8px">Project creation is a local workspace scaffold — no AI-OS decision authority.</div></div>`;
  }
  document.getElementById('page-project_workspace').innerHTML = html;
}

function createProject() {
  const name = document.getElementById('proj-name').value || 'Untitled Project';
  act('project.create', {name});
}

function renderIntegrations() {
  const p = DATA.pages.integrations_credentials;
  let html = card("Go-Live Readiness",
    kv("core_services", p.readiness.core_services) +
    kv("required_credentials", p.readiness.required_credentials) +
    kv("external_integrations", p.readiness.external_integrations) +
    kv("knowledge_system", p.readiness.knowledge_system) +
    kv("model_providers", p.readiness.model_providers) +
    kv("database", p.readiness.database) +
    `<span class="pill ${p.readiness.status==='READY'?'ok':'warn'}">${p.readiness.status}</span>` +
    (p.readiness.missing && p.readiness.missing.length ? `<div class="note">Missing: ${escapeHtml(p.readiness.missing.join(', '))}</div>` : ""));
  html += `<div class="card"><h3>Secret exposure</h3><div class="note">${escapeHtml(p.secret_exposure)}</div></div>`;
  const rows = (p.integrations||[]).map(i => {
    const cred = i.credential_configured ? `<span class="pill ok">CRED CONFIGURED</span>` : `<span class="pill bad">NO CREDENTIAL</span>`;
    const mode = i.mode === 'real' ? `<span class="pill warn">REAL MODE</span>` : `<span class="pill ok">MOCK MODE</span>`;
    const cfgBits = [];
    if (i.requires_filesystem_path) cfgBits.push("FS path");
    if (i.requires_git_config) cfgBits.push("Git");
    if (i.requires_local_endpoint) cfgBits.push("Endpoint");
    if (i.not_required_reason) cfgBits.push("not required");
    return `<div class="card"><h3>${escapeHtml(i.integration_name)}</h3>
      ${kv("purpose", i.purpose || "—")}
      ${kv("state", i.state)}
      ${kv("mode", i.mode)}
      ${kv("real_allowed", i.real_allowed)}
      ${kv("credential_required", (i.required_credentials||[]).join(", ") || "none")}
      ${kv("config_requires", cfgBits.join(", ") || "none")}
      <div class="row"><span class="k">credential</span><span class="v">${cred}</span></div>
      <div class="row"><span class="k">mode</span><span class="v">${mode}</span></div>
      <div class="row"><span class="k">last_verified</span><span class="v">${escapeHtml(String(i.last_verified||'—'))}</span></div>
      <button class="action" onclick="act('integration.validate',{name:'${i.integration_name}'})">Validate</button>
      <button class="action" onclick="act('integration.health_check',{name:'${i.integration_name}'})">Health check</button>
    </div>`;
  }).join('');
  html += card(`Integrations (${p.integrations.length})`, rows || "<div class='note'>none</div>");
  document.getElementById('page-integrations_credentials').innerHTML = html;
}

function renderHealth() {
  const p = DATA.pages.system_health;
  const ks = p.kernel_stats || {};
  let html = card("Authority Preservation", p.authority_preserved
      ? `<span class="pill ok">AI-OS SOLE AUTHORITY PRESERVED</span>`
      : `<span class="pill bad">AUTHORITY ISSUE</span>`);
  html += card("Kernel Stats", kv("running", ks.running) + kv("uptime_seconds", Math.round(ks.uptime_seconds||0))
    + kv("services", ks.service_count) + kv("healthy_services", ks.healthy_services));
  const viol = (p.terminal_contract_violations||[]).map(v => `<div class="row"><span class="k">violation</span><span class="v bad">${escapeHtml(v||'')}</span></div>`).join('');
  html += card("Terminal-Contract Violations", viol || "<div class='note'>none</div>");
  document.getElementById('page-system_health').innerHTML = html;
}

function renderObservability() {
  const p = DATA.pages.system_observability;
  if (!p) {
    document.getElementById('page-system_observability').innerHTML =
      card("System Observability", "<div class='note'>Observability data unavailable</div>");
    return;
  }

  let html = "";

  // A. Metrics
  const metrics = (p.metrics || []).map(m =>
    card(m.name,
      kv("type", m.metric_type) +
      kv("value", m.value) +
      kv("unit", m.unit || "—") +
      kv("labels", JSON.stringify(m.labels || {}))
    )
  ).join('');
  html += card("Metrics (" + (p.metrics?.length || 0) + ")", metrics || "<div class='note'>No metrics recorded</div>");

  // B. Trace Spans
  const spans = (p.spans || []).map(s =>
    card(s.name,
      kv("span_id", s.span_id) +
      kv("trace_id", s.trace_id) +
      kv("parent_span_id", s.parent_span_id || "—") +
      kv("attributes", JSON.stringify(s.attributes || {}))
    )
  ).join('');
  html += card("Trace Spans (" + (p.spans?.length || 0) + ")", spans || "<div class='note'>No active spans</div>");

  // C. Health
  const h = p.health || {};
  let healthHtml = card("Overall Health",
    kv("status", h.overall || "UNKNOWN") +
    kv("total_checks", h.total_checks || 0) +
    kv("healthy", h.healthy_checks || 0) +
    kv("degraded", h.degraded_checks || 0) +
    kv("unhealthy", h.unhealthy_checks || 0) +
    kv("unknown", h.unknown_checks || 0)
  );
  const components = Object.entries(h.components || {}).map(([name, status]) =>
    `<div class="row"><span class="k">${escapeHtml(name)}</span><span class="v ${status==='HEALTHY'?'ok':status==='DEGRADED'?'warn':status==='UNHEALTHY'?'bad':''}">${escapeHtml(status)}</span></div>`
  ).join('');
  healthHtml += card("Component Health (" + Object.keys(h.components || {}).length + ")",
    components || "<div class='note'>No component health data</div>");
  if (h.note) {
    healthHtml += `<div class="note">${escapeHtml(h.note)}</div>`;
  }
  html += healthHtml;

  // D. Recent Events
  const events = (p.recent_events || []).slice(0, 50).map(e =>
    card(escapeHtml(e.event_type),
      kv("timestamp", e.timestamp) +
      kv("source", e.source) +
      kv("correlation_id", e.correlation_id || "—") +
      kv("causation_id", e.causation_id || "—") +
      kv("payload", JSON.stringify(e.payload_summary || {}))
    )
  ).join('');
  html += card("Recent Events (" + (p.recent_events?.length || 0) + ")", events || "<div class='note'>No recent events</div>");

  document.getElementById('page-system_observability').innerHTML = html;
}

async function act(action, params) {
  try {
    const res = await fetch(API_ACTION, { method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ action, params, principal:"dashboard_user" }) });
    const out = await res.json();
    toast(`[${action}] ${out.status} — ${out.detail||''}`, out.authorized || out.status==='completed');
  } catch (e) { toast("action error: "+e, false); }
  setTimeout(load, 600);
}

document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  document.getElementById('page-'+b.dataset.page).classList.add('active');
}));

load();
setInterval(load, 5000);
</script>
</body>
</html>
