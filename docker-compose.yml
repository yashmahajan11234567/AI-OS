version: '3.8'

# AI-OS Docker Compose
# Defines the container topology for the AI-OS system (Python application)
# AI-OS is the single deployable unit; external systems are bounded resources

services:
  # =========================================================================
  # AI-OS Kernel (Single Deployable Unit)
  # =========================================================================
  ai-os:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-os:latest
    container_name: ai-os
    hostname: ai-os
    restart: unless-stopped
    # Run as non-root user (UID 10000)
    user: "10000:10000"
    environment:
      # Kernel configuration
      - KERNEL_NAME=Hermes
      - KERNEL_VERSION=1.0.0
      - KERNEL_LOG_LEVEL=INFO
      - KERNEL_ENVIRONMENT=production
      - KERNEL_DATA_DIR=/opt/data

      # Configuration
      - AIOS_CONFIG_PATH=/opt/ai-os/config/defaults.yaml
      - AIOS_KERNEL_ENVIRONMENT=production
      - AIOS_KERNEL_LOG_LEVEL=INFO

      # Runtime
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

      # External integrations (optional - require real credentials)
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - N8N_BASE_URL=${N8N_BASE_URL:-}
      - N8N_API_KEY=${N8N_API_KEY:-}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-}
      - OBSIDIAN_GIT_REMOTE_URL=${OBSIDIAN_GIT_REMOTE_URL:-}
      - OBSIDIAN_VAULT_PATH=${OBSIDIAN_VAULT_PATH:-}

      # Real integration gate (ADR-007)
      - AIOS_REAL_INTEGRATION_ENABLED=${AIOS_REAL_INTEGRATION_ENABLED:-0}

      # Autonomy (M10) - disabled by default per spec
      - AIOS_SERVICES_AUTONOMY_ENABLED=false

      # Dashboard (optional - enabled via env var)
      - AIOS_SERVICES_DASHBOARD_ENABLED=${AIOS_SERVICES_DASHBOARD_ENABLED:-false}
      - AIOS_SERVICES_DASHBOARD_HOST=0.0.0.0
      - AIOS_SERVICES_DASHBOARD_PORT=3000
      - AIOS_SERVICES_DASHBOARD_AUTH_ENABLED=${AIOS_SERVICES_DASHBOARD_AUTH_ENABLED:-true}

      # UID/GID (already handled by user directive above)
      - HERMES_UID=10000
      - HERMES_GID=10000
    volumes:
      - ai-os-data:/opt/data
      - ./config:/opt/ai-os/config:ro
    ports:
      - "3000:3000"   # Dashboard (if enabled)
    healthcheck:
      test: ["CMD", "/opt/ai-os/.venv/bin/aios", "kernel", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ai-os-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G

