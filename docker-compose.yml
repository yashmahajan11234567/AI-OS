# =========================================================================
# Configuration Notes
# =========================================================================
#
# Deployment Model (per architecture/Part15/deployment.md):
#   - AI-OS is the single deployable unit (Python application)
#   - All Core Components, Core Managers, Engineering Services run in one process
#   - External systems (Redis, PostgreSQL) are bounded resources, not deployed by AI-OS
#   - Configuration uses four-layer merge: defaults.yaml -> app.yaml -> env.yaml -> AIOS_* env vars
#   - Configuration freezes after Phase 3 (INV-DEP-04)
#   - Autonomy services (M10) gated behind services.autonomy.enabled: false
#   - Real integrations gated behind AIOS_REAL_INTEGRATION_ENABLED=1
#
# Health Probes:
#   - Liveness: Process responds to health check
#   - Readiness: All Phase 0-3 initialization complete, no CRITICAL failures
#   - Startup: Initialization in progress
#   - Architecture: healthCheck() polling (GAP-DEP-06: exposure mechanism UNSPECIFIED)
#
# Security:
#   - Non-root user (UID 10000)
#   - Read-only root filesystem (COPY --chmod=a+rX,go-w)
#   - Secret references via environment variables, never hardcoded
#   - SecurityManager gate-before-connect for all external resources
#   - Trust boundary: AI-OS process only (Part 14 §14.9)
#
# Resource Requirements:
#   - AI-OS Kernel: 1-4 CPUs, 1-4 GB RAM